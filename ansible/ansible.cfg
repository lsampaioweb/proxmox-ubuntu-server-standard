[defaults]
# Inform Ansible to use this specific file as the inventory.
inventory = inventory/hosts

# Inform Ansible to output some information about the playbook execution.
callbacks_enabled = timer, profile_roles

# Inform Ansible to use this version as default.
interpreter_python = /usr/bin/python3

# Number of parallel connection processes.
forks = 10

# Disable automatic retry file generation on task failures.
retry_files_enabled = false

# Gather facts using SSH connection method (cache-friendly).
gathering = smart

[ssh_connection]
# Control socket for connection reuse; 60s persist reduces reconnects during playbook runs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Enable pipelining to reduce SSH connections during privilege escalation.
pipelining = true

# SSH connection timeout in seconds.
timeout = 30
